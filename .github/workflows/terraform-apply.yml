name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::746552104319:role/olist-github-actions-dev
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
        
      - name: Smoke Test Analytics API
        run: |
          API_URL=$(terraform output -raw analytics_api_url)

          echo "Testing Analytics API..."
          echo "Endpoint: $API_URL"

          HTTP_STATUS=$(curl --silent \
            --output /tmp/analytics-response.json \
            --write-out "%{http_code}" \
            "$API_URL")

          echo "HTTP status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/analytics-response.json

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Smoke test failed: expected HTTP 200, received $HTTP_STATUS"
            exit 1
          fi

          echo "Smoke test passed."