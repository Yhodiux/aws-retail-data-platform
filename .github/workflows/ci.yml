name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analytics-api-tests:
    name: Analytics API Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: functions/analytics_api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Analytics API unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/functions/analytics_api
        run: pytest tests -v -m "not integration"
      
  pyspark-tests:
    name: PySpark Pipeline Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install PySpark
        run: |
          python -m pip install --upgrade pip
          pip install pyspark pytest

      - name: Run PySpark pipeline tests
        env:
          PYTHONPATH: ${{ github.workspace }}/libs/common.zip
        run: pytest tests/test_pyspark_pipeline.py -v

  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate